services:
  db:
    build: ./db
    environment:
      POSTGRES_USER: graphraguser
      POSTGRES_PASSWORD: graphragpassword
      POSTGRES_DB: graphragdb
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graphraguser -d graphragdb"]
      interval: 5s
      timeout: 5s
      retries: 5
      
  ingestion-service:
    build: ./ingestion_service
    environment:
      DATABASE_URL: postgresql://graphraguser:graphragpassword@db:5432/graphragdb
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    ports:
      - "5050:5050"
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
      grobid:
        condition: service_started

  graphrag-processor:
    build: ./graphrag_processor
    environment:
      DATABASE_URL: postgresql://graphraguser:graphragpassword@db:5432/graphragdb
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    volumes:
      - graphrag_outputs:/app/outputs
    depends_on:
      - db
      - ingestion-service

  api-service:
    build: ./api_service
    environment:
      DATABASE_URL: postgresql://graphraguser:graphragpassword@db:5432/graphragdb
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GRAPH_OUTPUT_PATH: /app/graph_data
    ports:
      - "8000:8000"
    volumes:
      - graphrag_outputs:/app/graph_data
    depends_on:
      - db
      - graphrag-processor

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api-service
      
  ocr-service:
    build: ./ocr_service
    ports:
      - "1337:1337"
    environment:
      INPUT_DIR: /app/input
      OUTPUT_DIR: /app/output
      POLL_INTERVAL: 5
    volumes:
      - ocr_input:/app/input
      - ocr_output:/app/output

  grobid:
    image: lfoppiano/grobid:latest-crf
    ports:
      - "8070:8070"
    environment:
      GROBID_SERVICE: "processFulltextDocument"
    volumes:
      - grobid_data:/opt/grobid

  mcp-server:
    build:
      context: .
      dockerfile: ./mcp_server/Dockerfile
    environment:
      DATABASE_URL: postgresql://graphraguser:graphragpassword@db:5432/graphragdb
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      INGESTION_SERVICE_URL: http://ingestion-service:5050
      PYTHONPATH: /app
    volumes:
      - graphrag_outputs:/app/graph_data
    depends_on:
      - db
      - api-service
      - ingestion-service
    stdin_open: true
    tty: true
    command: ["/app/mcp_server/run_mcp_server.sh"]

  unstructured-api:
    image: downloads.unstructured.io/unstructured-io/unstructured-api:latest
    ports:
      - "8001:8000"
    environment:
      UNSTRUCTURED_API_KEY: ${UNSTRUCTURED_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  knowledge-system:
    build:
      context: .
      dockerfile: ./knowledge_system_service/Dockerfile
    environment:
      DATABASE_URL: postgresql://graphraguser:graphragpassword@db:5432/graphragdb
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      API_SERVICE_URL: http://api-service:8000
      INGESTION_SERVICE_URL: http://ingestion-service:5050
      UNSTRUCTURED_API_URL: http://unstructured-api:8000
      WORKFLOW_CONFIG_PATH: /app/knowledge_system/examples/workflows.yaml
      ENABLE_AUDIT_LOGGING: "true"
      AUDIT_LEVEL: detailed
    ports:
      - "8100:8100"
    volumes:
      - ./src/knowledge_system:/app/knowledge_system
      - knowledge_system_logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      api-service:
        condition: service_started
      ingestion-service:
        condition: service_started
      unstructured-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  pg_data:
  graphrag_outputs:
  ocr_input:
  ocr_output:
  mg_data:
  grobid_data:
  knowledge_system_logs: